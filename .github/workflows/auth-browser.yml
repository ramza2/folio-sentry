name: AUTH-01 Browser Acceptance

on:
  push:
    branches: ["feat/auth01-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: folio_auth_e2e
          POSTGRES_USER: folio_auth_e2e
          POSTGRES_PASSWORD: ci-auth-e2e-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folio_auth_e2e -d folio_auth_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FOLIOSENTRY_DB_HOST: 127.0.0.1
      FOLIOSENTRY_DB_PORT: "5432"
      FOLIOSENTRY_DB_USER: folio_auth_e2e
      FOLIOSENTRY_DB_NAME: folio_auth_e2e
      FOLIOSENTRY_DB_PASSWORD: ci-auth-e2e-only
      FOLIOSENTRY_AUTH_ALLOWED_ORIGINS: http://127.0.0.1:18902
      FOLIOSENTRY_AUTH_COOKIE_SECURE: "false"
      FOLIOSENTRY_ALLOW_HTTP_DEV: "true"
      VITE_API_PROXY_TARGET: http://127.0.0.1:18091
      FOLIOSENTRY_E2E_ORIGIN: http://127.0.0.1:18902
      FOLIOSENTRY_E2E_USERNAME: ci-owner
      FOLIOSENTRY_E2E_PASSWORD: ci-e2e-only-synthetic-owner-password-123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
      - name: Install Python backend
        run: python -m pip install -e ./backend
      - name: Install frontend and test-only browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Apply authentication schema to CI-only PostgreSQL
        working-directory: backend
        run: |
          alembic upgrade head
          python - <<'PY'
          from app.auth import bootstrap_owner, auth_ready
          import os
          bootstrap_owner(os.environ["FOLIOSENTRY_E2E_USERNAME"], os.environ["FOLIOSENTRY_E2E_PASSWORD"])
          assert auth_ready()
          print("FOLIOSENTRY_E2E_AUTH_ISOLATED_BOOTSTRAP_PASS")
          PY
      - name: Start CI-only backend and frontend on loopback
        run: |
          (cd backend && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 18091 > "$RUNNER_TEMP/folio-backend.log" 2>&1 &)
          (cd frontend && nohup npm run dev -- --host 127.0.0.1 --port 18902 > "$RUNNER_TEMP/folio-frontend.log" 2>&1 &)
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18091/api/health/ready >/dev/null &&
               curl -fsS http://127.0.0.1:18902/ >/dev/null; then
              echo "FOLIOSENTRY_E2E_SERVICES_READY"
              exit 0
            fi
            sleep 2
          done
          echo "CI local services did not become ready"
          exit 1
      - name: Real Chromium browser acceptance
        working-directory: frontend
        run: node e2e/auth-browser-smoke.mjs
      - name: Upload browser screenshots (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foliosentry-auth-browser-screenshots
          path: frontend/e2e/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Print limited diagnostics on failure
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/folio-backend.log" "$RUNNER_TEMP/folio-frontend.log"; do
            if [ -f "$f" ]; then tail -n 70 "$f"; fi
          done
