name: CI

# One PR event, not both feat branch push + PR; main push is a post-merge check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: foliosentry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Change impact (fail closed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.route.outputs['backend'] }}
      frontend: ${{ steps.route.outputs['frontend'] }}
      compose-config: ${{ steps.route.outputs['compose-config'] }}
      auth-db-migration: ${{ steps.route.outputs['auth-db-migration'] }}
      deploy01-production-config: ${{ steps.route.outputs['deploy01-production-config'] }}
      deploy02-backup-e2e: ${{ steps.route.outputs['deploy02-backup-e2e'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate impact router and stable gate (offline stdlib)
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Route changed areas (unknown means full)
        id: route
        env:
          FOLIOSENTRY_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FOLIOSENTRY_CI_HEAD: ${{ github.sha }}
        run: python3 scripts/ci/impact.py
  backend:
    needs: changes
    if: ${{ needs.changes.outputs['backend'] == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile check
        run: python -m compileall -q app

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs['frontend'] == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: DEMO adapter unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  compose-config:
    needs: changes
    if: ${{ needs.changes.outputs['compose-config'] == 'true' }}
    timeout-minutes: 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated compose file (no services started)
        env:
          FOLIOSENTRY_DB_PASSWORD: ci-placeholder-not-a-real-secret
        run: docker compose -f compose.yaml config -q
      - name: MiniPC preflight syntax and read-only smoke
        run: |
          bash -n scripts/minipc-auth-preflight.sh
          output="$(bash scripts/minipc-auth-preflight.sh "$PWD")"
          printf '%s\n' "$output"
          grep -Fq 'FOLIOSENTRY_MINIPC_PREFLIGHT_READONLY_COMPLETE' <<< "$output"
          grep -Fq 'CONTAINERS_MODIFIED=NO' <<< "$output"
          grep -Fq 'DATABASE_MODIFIED=NO' <<< "$output"
          grep -Fq 'PORTS_CHANGED=NO' <<< "$output"
          grep -Fq 'CREDENTIALS_REQUESTED=NO' <<< "$output"
          grep -Fq "REPO_DIR=$PWD" <<< "$output"
          grep -Fq "BRANCH=" <<< "$output"
          grep -Fq "HEAD=" <<< "$output"
          grep -Fq "REPO_DISK_FREE=" <<< "$output"
          if grep -Fq "REVIEW_REPO=NOT_FOUND" <<< "$output"; then exit 1; fi
          missing="$(bash scripts/minipc-auth-preflight.sh /nonexistent/folio-test-path)"
          grep -Fq "REVIEW_REPO=NOT_FOUND" <<< "$missing"
          grep -Fq "CONTAINERS_MODIFIED=NO" <<< "$missing"

  auth-db-migration:
    needs: changes
    if: ${{ needs.changes.outputs['auth-db-migration'] == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: folio_ci
          POSTGRES_USER: folio_ci
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U folio_ci -d folio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      FOLIOSENTRY_DB_HOST: 127.0.0.1
      FOLIOSENTRY_DB_PORT: "5432"
      FOLIOSENTRY_DB_USER: folio_ci
      FOLIOSENTRY_DB_NAME: folio_ci
      FOLIOSENTRY_DB_PASSWORD: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -e .
      - name: Apply isolated CI authentication and Phase 1 migrations
        run: alembic upgrade head
      - name: Verify single owner bootstrap and authenticated readiness
        run: |
          python - <<'PY'
          from app.auth import bootstrap_owner, auth_ready
          from app.auth_models import AuthSession, Owner
          from app.database import get_engine
          from sqlalchemy import inspect
          assert not auth_ready()
          bootstrap_owner("ci-owner", "ci-only-synthetic-password-123!")
          assert auth_ready()
          tables = set(inspect(get_engine()).get_table_names())
          from pathlib import Path
          md03_migration = Path("migrations/versions/20261120_pricebar01.py").is_file()
          md03_test = Path("scripts/test_price_bar_isolated_ci.py").is_file()
          assert md03_migration == md03_test, "MD03_PARTIAL_INTEGRATION_BLOCKED"
          md04c3_migration = Path("migrations/versions/20261123_quality01.py").is_file()
          md04c3_test = Path("scripts/test_quality_evidence_isolated_ci.py").is_file()
          assert md04c3_migration == md04c3_test, "MD04C3_ISOLATED_INTEGRATION_BLOCKED"
          assert not md04c3_migration or md03_migration, "MD04C3_REQUIRES_MD03"
          required_tables = {"auth_owner", "auth_session", "alembic_version",
                             "instrument", "tracked_instrument"}
          if md03_migration:
              required_tables.add("price_bar")
          if md04c3_migration:
              required_tables.add("price_quality_evidence")
          assert required_tables.issubset(tables)
          from decimal import Decimal
          from sqlalchemy.orm import Session
          from sqlalchemy import text
          from app.portfolio_models import Instrument, TrackedInstrument
          with Session(get_engine()) as db:
              inst = Instrument(market="KR", exchange_mic="XKRX", symbol="000001",
                                normalized_symbol="000001", name="CI synthetic stock",
                                currency="KRW", asset_type="STOCK", timezone="Asia/Seoul")
              db.add(inst)
              db.flush()
              item = TrackedInstrument(instrument_id=inst.id, kind="HOLDING",
                                       quantity=Decimal("2.50000000"),
                                       average_cost=Decimal("100.12500000"))
              db.add(item)
              db.flush()
              assert db.get(TrackedInstrument, item.id).quantity == Decimal("2.50000000")
              # Intentionally never commit synthetic portfolio rows to this CI DB.
              db.rollback()
          with get_engine().connect() as conn:
              rev = conn.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
              expected_revision = (
                  "20261123_quality01" if md04c3_migration else
                  "20261120_pricebar01" if md03_migration else
                  "20261119_portfolio01"
              )
              assert rev == expected_revision
              assert conn.execute(text("SELECT count(*) FROM instrument")).scalar_one() == 0
              assert conn.execute(text("SELECT count(*) FROM tracked_instrument")).scalar_one() == 0
              if md03_migration:
                  assert conn.execute(text("SELECT count(*) FROM price_bar")).scalar_one() == 0
              if md04c3_migration:
                  assert conn.execute(text("SELECT count(*) FROM price_quality_evidence")).scalar_one() == 0
          print("FOLIOSENTRY_AUTH01_ISOLATED_MIGRATION_PASS")
          print("FOLIOSENTRY_PHASE1_PORTFOLIO_MIGRATION_CI_PASS")
          if md03_migration:
              print("FOLIOSENTRY_MD03_ISOLATED_SCHEMA_CI_PASS")
          if md04c3_migration:
              print("FOLIOSENTRY_MD04C3_ISOLATED_SCHEMA_CI_PASS")
          PY
      - name: MD03 price-bar idempotency and finality guards (when schema exists)
        env:
          FOLIOSENTRY_MD03_ISOLATED_DB_TEST: "yes"
        run: |
          if test -f migrations/versions/20261120_pricebar01.py; then
            test -f scripts/test_price_bar_isolated_ci.py
            python scripts/test_price_bar_isolated_ci.py
          elif test -e scripts/test_price_bar_isolated_ci.py; then
            echo "MD03_PARTIAL_INTEGRATION_BLOCKED" >&2
            exit 1
          else
            echo "FOLIOSENTRY_MD03_NOT_PRESENT_PRE_MERGE"
          fi
      - name: MD04C3 quality evidence isolated PostgreSQL guards (when schema exists)
        env:
          FOLIOSENTRY_MD04C3_ISOLATED_DB_TEST: "yes"
        run: |
          if test -f migrations/versions/20261123_quality01.py; then
            test -f scripts/test_quality_evidence_isolated_ci.py
            test -f migrations/versions/20261120_pricebar01.py
            python scripts/test_quality_evidence_isolated_ci.py
          elif test -e scripts/test_quality_evidence_isolated_ci.py; then
            echo "MD04C3_ISOLATED_INTEGRATION_BLOCKED" >&2
            exit 1
          else
            echo "FOLIOSENTRY_MD04C3_NOT_PRESENT_PRE_MERGE"
          fi

  deploy01-production-config:
    needs: changes
    if: ${{ needs.changes.outputs['deploy01-production-config'] == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts are syntactically sound
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/phase1-live-preflight.sh
          bash -n scripts/phase1-app-deploy.sh
          if bash scripts/phase1-app-deploy.sh >/dev/null 2>&1; then
            echo "Phase 1 app deploy must fail without explicit confirmation"
            exit 1
          fi
          grep -Fq "FOLIOSENTRY_PHASE1_NESTED_ROUTER_SCHEMA_PASS" scripts/phase1-app-deploy.sh
          grep -Fq "BACKUP_TIMER=INACTIVE_DISABLED" scripts/phase1-app-deploy.sh

          grep -Fq "FOLIOSENTRY_PHASE1_LIVE_READONLY_PREFLIGHT_PASS" scripts/phase1-live-preflight.sh
          grep -Fq "BACKUP_TIMER=INACTIVE_DISABLED" scripts/phase1-live-preflight.sh
          bash -n scripts/inspect-traefik.sh
          bash -n scripts/check-duckdns-route.sh
          bash -n scripts/backup-db.sh
          python3 -m py_compile scripts/verify-public-https.py
          python3 scripts/verify-public-https.py --self-test
          grep -Fq 'FOLIOSENTRY_${kind^^}_BACKUP_VERIFY_PASS' scripts/backup-db.sh
          grep -Fq "FOLIOSENTRY_HTTPS_VERIFY=FAIL_STOPPING_OWN_FRONTEND" scripts/deploy.sh
          grep -Fq "scripts/backup-db.sh" scripts/deploy.sh
          if bash scripts/backup-db.sh >/dev/null 2>&1; then
            echo "Backup guard without confirmation unexpectedly succeeded"
            exit 1
          fi
          if bash scripts/deploy.sh unpublish >/dev/null 2>&1; then
            echo "Unpublish guard without confirmation unexpectedly succeeded"
            exit 1
          fi
          python3 scripts/check-existing-tls.py --self-test
          python3 scripts/inspect-traefik-acme.py --self-test
          grep -Fq "TRAEFIK_ACME_PREFLIGHT=PASS_NOT_EXTERNAL_REACHABILITY" scripts/deploy.sh
          grep -Fq "FOLIOSENTRY_DUCKDNS_READONLY_CHECK_PASS" scripts/deploy.sh
          grep -Fq "ACME_STORAGE_MOUNT=MOUNT_PRESENT_NOT_BACKUP_VERIFIED" scripts/deploy.sh
          fakebin="$(mktemp -d)"
          cat > "$fakebin/getent" <<'EOF'
          #!/bin/sh
          [ "$1" = ahostsv4 ] || exit 1
          case "$2" in
            picknext.ramza.duckdns.org|foliosentry.ramza.duckdns.org)
              printf '192.0.2.42 STREAM %s\n' "$2" ;;
            *) exit 2 ;;
          esac
          EOF
          chmod +x "$fakebin/getent"
          result="$(PATH="$fakebin:$PATH" bash scripts/check-duckdns-route.sh)"
          grep -Fq "FOLIOSENTRY_DUCKDNS_READONLY_CHECK_PASS" <<< "$result"
          grep -Fq "IP_VALUES_PRINTED=NO" <<< "$result"
          if grep -Fq "192.0.2.42" <<< "$result"; then exit 1; fi
          grep -Fq "Existing Traefik Docker network [proxy]:" scripts/deploy.sh
          grep -Fq "Existing HTTPS entrypoint [websecure]:" scripts/deploy.sh
          grep -Fq "Existing TLS certificate resolver [myresolver]:" scripts/deploy.sh
          bash scripts/deploy.sh --help
          if bash scripts/deploy.sh db-init >/dev/null 2>&1; then
            echo "db-init missing-confirmation unexpectedly succeeded"
            exit 1
          fi
          if bash scripts/deploy.sh publish >/dev/null 2>&1; then
            echo "publish missing-confirmation unexpectedly succeeded"
            exit 1
          fi
          echo "FOLIOSENTRY_DEPLOY01_MUTATION_GUARDS_PASS"
      - name: Validate independent production and Traefik overrides
        run: |
          secret="$RUNNER_TEMP/folio-ci-db-secret"
          printf '%s\n' 'synthetic-ci-only-not-a-real-password' > "$secret"
          chmod 600 "$secret"
          envfile="$RUNNER_TEMP/folio-ci.env"
          {
            echo "FOLIOSENTRY_DOMAIN=foliosentry.example.duckdns.org"
            echo "FOLIOSENTRY_TRAEFIK_NETWORK=foliosentry-ci-edge"
            echo "FOLIOSENTRY_TRAEFIK_ENTRYPOINT=websecure"
            echo "FOLIOSENTRY_TRAEFIK_CERTRESOLVER=ci-resolver"
            echo "FOLIOSENTRY_DB_SECRET_FILE=$secret"
          } > "$envfile"
          chmod 600 "$envfile"
          dc=(docker compose -p foliosentry-prod --env-file "$envfile" -f compose.production.yml -f compose.traefik.yml)
          "${dc[@]}" config -q
          "${dc[@]}" config --format json > "$RUNNER_TEMP/folio-ci-compose.json"
          python3 - "$RUNNER_TEMP/folio-ci-compose.json" <<'PY'
          import json, sys
          obj = json.load(open(sys.argv[1], encoding="utf-8"))
          sv = obj["services"]
          assert set(sv) == {"db", "backend", "frontend"}
          assert all(not svc.get("ports") for svc in sv.values()), "host ports not allowed"
          assert sv["db"]["labels"]["traefik.enable"] == "false"
          assert sv["backend"]["labels"]["traefik.enable"] == "false"
          labels = sv["frontend"]["labels"]
          assert labels["traefik.enable"] == "true"
          assert labels["traefik.docker.network"] == "foliosentry-ci-edge"
          assert labels["traefik.http.routers.foliosentry-prod.tls"] == "true"
          assert "foliosentry.example.duckdns.org" in labels["traefik.http.routers.foliosentry-prod.rule"]
          assert "traefik_edge" in sv["frontend"]["networks"]
          assert "traefik_edge" not in sv["backend"]["networks"]
          assert "traefik_edge" not in sv["db"]["networks"]
          assert "443" not in str([svc.get("ports") for svc in sv.values()])
          assert sv["backend"]["environment"]["FOLIOSENTRY_AUTH_COOKIE_SECURE"] == "true"
          assert sv["backend"]["environment"]["FOLIOSENTRY_ALLOW_HTTP_DEV"] == "false"
          print("FOLIOSENTRY_DEPLOY01_PRIVATE_NETWORK_HTTPS_CONTRACT_PASS")
          PY
      - name: Build production frontend (Nginx, not Vite dev server)
        run: |
          docker build --file frontend/Dockerfile.prod --tag foliosentry-prod-ci:local frontend
          docker image inspect foliosentry-prod-ci:local >/dev/null

  deploy02-backup-e2e:
    needs: changes
    if: ${{ needs.changes.outputs['deploy02-backup-e2e'] == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test pre-publication PostgreSQL backup on isolated synthetic container
        run: |
          bash -n scripts/backup-db.sh
          bash -n scripts/test-backup-ci.sh
          bash -n scripts/verify-backup-restore.sh
          bash -n scripts/run-daily-backup.sh
          grep -Fq "PREPUBLISH_BACKUPS_PRESERVED=YES" scripts/run-daily-backup.sh
          bash scripts/test-backup-ci.sh

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [changes, backend, frontend, compose-config, auth-db-migration, deploy01-production-config, deploy02-backup-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FOLIOSENTRY_CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify all selected checks passed; ignored checks skipped
        run: python3 scripts/ci/final_gate.py
